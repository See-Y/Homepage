body.game-experience #topView{flex:0 0 auto;min-height:44px;padding:6px 13px;border-radius:10px;background:#182833eb;color:#f2f5f7;border:1px solid #90a4b766;font-size:13px;white-space:nowrap}

.room-bar{display:flex;align-items:center;gap:4px;flex-wrap:wrap}.room-bar button[aria-pressed=true]{background:#254f61;color:#fff}#moveHint{font-size:12px}
body.game-experience .home-controls{gap:6px;max-width:880px}
body.game-experience .room-bar{display:flex;align-items:center;gap:4px;max-width:100%;overflow-x:auto;scrollbar-width:none;padding:4px;background:#182833eb;border:1px solid #90a4b766;border-radius:12px;pointer-events:auto}

body.game-experience .room-bar .room-now{font-size:10px;color:#a9b9c4;letter-spacing:.08em;padding:0 4px 0 6px;white-space:nowrap}
body.game-experience .room-bar button{flex:0 0 auto;min-height:38px;padding:6px 12px;font-size:13px;border-radius:9px;border:1px solid transparent;background:transparent;color:#dfe7ec;white-space:nowrap}
body.game-experience .room-bar button:hover{background:#ffffff14;border-color:#90a4b766}
body.game-experience .room-bar button[aria-pressed=true]{background:#efc885;color:#1a2730;font-weight:700}
body.game-experience .room-bar button.plan{margin-left:4px;border-color:#90a4b766;color:#efc885}
body.game-experience .tool-row{display:flex;align-items:center;gap:6px;pointer-events:auto}
body.game-experience #trayToggle{display:none}
body.game-experience .room-tools{width:auto;display:flex;flex-wrap:wrap;gap:6px}
body.game-experience .room-tools button{min-height:40px;padding:6px 12px;font-size:12px}
body.game-experience #unitToggle{background:#182833eb;color:#f2f5f7;border:1px solid #90a4b766;border-radius:10px;min-height:40px;font-size:12px;padding:6px 12px}
body.game-experience #sameFloorChoices{display:none}
